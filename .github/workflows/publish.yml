name: Publish
# Manual only. Publishing needs the maintainer to start this workflow, type the
# version, and approve the "marketplace" environment. See docs/RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (must equal package.json version)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: marketplace
    env:
      REQUESTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - name: Confirm requested version
        run: |
          actual="$(node -p "require('./package.json').version")"
          if [ "$actual" != "$REQUESTED_VERSION" ]; then
            echo "package.json has $actual, but $REQUESTED_VERSION was requested." >&2
            exit 1
          fi
          echo "VSIX=artifacts/xqlibur-$actual.vsix" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run package
      # Ubuntu 24.04 blocks the unprivileged user namespaces Electron's sandbox
      # needs. Allow them for this runner so the editor keeps its sandbox.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a npm run test:package
      - name: Record VSIX checksum
        run: sha256sum "$VSIX" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: xqlibur-vsix
          path: artifacts/*.vsix
          if-no-files-found: error
      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "VSCE_PAT secret is not set." >&2; exit 1; fi
          npx --no-install vsce publish --packagePath "$VSIX"
      - name: Publish to Open VSX (optional)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "OVSX_PAT not set; skipping Open VSX." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          npx --yes ovsx@1.3.0 publish "$VSIX" --pat "$OVSX_PAT"
