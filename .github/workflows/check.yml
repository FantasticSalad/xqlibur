name: Check
on: [push, pull_request]
permissions:
  contents: read
env:
  SOURCE_DATE_EPOCH: '946684800'
  TZ: UTC
jobs:
  test:
    # A pull request from a branch of this repository was already checked by its push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      matrix:
        # Hosted Windows and macOS runners cost several times a Linux one in a private
        # repository, so there they run on the default branch only and other branches run
        # Linux. A public repository runs all three every time.
        os: ${{ fromJSON((github.ref_name == github.event.repository.default_branch || !github.event.repository.private) && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: npm run package
  package-host:
    # Runs the extracted VSIX in an isolated VS Code profile in Restricted Mode.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run package
      # Ubuntu 24.04 blocks the unprivileged user namespaces Electron's sandbox
      # needs. Allow them for this runner so the editor keeps its sandbox.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a npm run test:package
